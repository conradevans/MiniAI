[Service]
# The base unit blocks setuid execution and removes the capabilities sudo needs
# to enter the fixed root helper. Restore only sudo's UID/GID transition caps.
NoNewPrivileges=false
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
# Preserve ProtectKernelTunables=true and ProtectSystem=strict globally while
# carving out only cpufreq and the helper's dedicated runtime state directory.
ReadWritePaths=/sys/devices/system/cpu/cpufreq /run/miniai-power
